<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>INSPIRIA-Principal</title>
    <link rel="stylesheet" href="../estilo.css">
</head>
<body>
    <div class="contenedorPrincipal">
        
        <div class="barraOpciones">
            <ul class="menu">
                <li class="activo">
                    <img src="../inicio.png" class="iconoMenu"> Inicio</li>
                <li><img src="../mas.png" class="iconoMenu"> Publicar</li>
                <li><img src="../crecer.png" class="iconoMenu"> Tendencias</li>
                <li><img src="../corazon.png" class="iconoMenu"> Siguiendo</li>
                <li><img src="../guardar.png" class="iconoMenu"> Guardados</li>
                <li><img src="../categoria.png" class="iconoMenu"> Categorías</li>
                <li><img src="../tematica.png" class="iconoMenu"> Temáticas</li>
                <li><img src="../muro.png" class="iconoMenu"> Muro</li>
            </ul>
            <div class="contenedorLogo">
                <img src="../logo_inspiria.png" alt="Logo Inspiria" class="imagenLogo">
            </div>
        </div>

        <div class="contenido">
            <div class="contenedorBusqueda">
                <input type="text" placeholder="Buscar" class="inputBuscar">
                <img src=" ../lupa.png" class="iconoLupa">
                <div class="contenedorPerfil">
                    <div class="circuloPerfil">
                        <img src="../usuario.png" class="iconoPerfil" alt="Perfil">
                    </div>
                </div>
            </div>

            <h2>Tendencias en categorías</h2>

            <div class="contenedorPodio">
                <div class="puesto-2">
                    <div class="numeroPosicion">2</div>
                    <div class="cajaCategoria">Cerámica</div>
                </div>
                <div class="puesto-1">
                    <div class="numeroPosicion">1</div>
                    <div class="cajaCategoria">Costura</div>
                </div>
                <div class="puesto-3">
                    <div class="numeroPosicion">3</div>
                    <div class="cajaCategoria">Crochet</div>
                </div>
                <div style="clear: both;"></div> </div>

            <div class="lista-tendencias">
                <div class="elementoLista">④ Papiroflexia.</div>
                <div class="elementoLista">⑤ Alambrismo.</div>
                <div class="elementoLista">⑥ Talla.</div>
                <div class="elementoLista">⑦ Orfebreria.</div>
            </div>
        </div>
        <!--Esta línea hace que lo que tiene que estar debajo se quede debajo
        y no intente ponerse al lado de lo anterior-->
        <div style="clear: both;"></div>
    </div>
</body>
</html>
