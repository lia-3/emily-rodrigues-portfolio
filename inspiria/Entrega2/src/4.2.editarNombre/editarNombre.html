<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INSPIRIA - Cambiar Nombre de Usuario</title>
    <link rel="stylesheet" href="../estilo.css">
</head>
<body>
    <div class="contenedorPrincipal">
        
        <div class="barraOpciones">
            <ul class="menu">
                <li><img src="../inicio.png" class="iconoMenu"> Inicio</li>
                <li><img src="../mas.png" class="iconoMenu"> Publicar</li>
                <li><img src="../crecer.png" class="iconoMenu"> Tendencias</li>
                <li><img src="../corazon.png" class="iconoMenu"> Siguiendo</li>
                <li><img src="../guardar.png" class="iconoMenu"> Guardados</li>
                <li><img src="../categoria.png" class="iconoMenu"> Categorías</li>
                <li><img src="../tematica.png" class="iconoMenu"> Temáticas</li>
                <li><img src="../muro.png" class="iconoMenu"> Muro</li>
            </ul>
            <div class="contenedorLogo">
                <img src="../logo_inspiria.png" alt="Logo Inspiria" class="imagenLogo">
            </div>
        </div>

        <div class="contenido">
            <div class="contenedorBusqueda">
                <input type="text" placeholder="Buscar" class="inputBuscar">
                <img src="../lupa.png" class="iconoLupa">
                <div class="contenedorPerfil">
                    <div class="circuloPerfil">
                        <img src="../perfil.jpg" class="iconoPerfil" alt="Perfil">
                    </div>
                </div>
            </div>

            <div class="seccionConfiguracion">
                <h1 class="tituloSeccion">Configuración | Nombre Usuario</h1>

                <div class="contenedorFormularioCentrado">
                    <form action="#" method="post">
                        
                        <div class="grupoFormulario">
                            <label for="nombreActual">Nombre de usuario actual</label>
                            <input type="text" id="nombreActual" name="nombreActual" value="Maria Perez" readonly class="inputFormulario inputSoloLectura">
                        </div>

                        <div class="grupoFormulario">
                            <label for="nuevoNombre">Nuevo nombre de usuario</label>
                            <input type="text" id="nuevoNombre" name="nuevoNombre" value="" class="inputFormulario">
                        </div>

                        <div class="contenedorBotones">
                            <button type="button" class="botonSecundario">Cancelar</button>
                            <button type="submit" class="botonPrincipal">Aceptar</button>
                        </div>

                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
