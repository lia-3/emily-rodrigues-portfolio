<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>INSPIRIA - Perfil de Usuario</title>
    <link rel="stylesheet" href="../estilo.css">
</head>
<body>
    <div class="contenedorPrincipal">
        
        <div class="barraOpciones">
            <ul class="menu">
                <li><img src="../inicio.png" class="iconoMenu"> Inicio</li>
                <li><img src="../mas.png" class="iconoMenu"> Publicar</li>
                <li><img src="../crecer.png" class="iconoMenu"> Tendencias</li>
                <li class="activo"><img src="../corazon.png" class="iconoMenu"> Siguiendo</li>
                <li><img src="../guardar.png" class="iconoMenu"> Guardados</li>
                <li><img src="../categoria.png" class="iconoMenu"> Categorías</li>
                <li><img src="../tematica.png" class="iconoMenu"> Temáticas</li>
                <li><img src="../muro.png" class="iconoMenu"> Muro</li>
            </ul>
            <div class="contenedorLogo">
                <img src="../logo_inspiria.png" alt="Logo Inspiria" class="imagenLogo">
            </div>
        </div>

        <div class="contenido">
            <div class="contenedorBusqueda">
                <input type="text" placeholder="Buscar" class="inputBuscar">
                <img src="../lupa.png" class="iconoLupa">
                <div class="contenedorPerfil">
                    <div class="circuloPerfil">
                        <img src="../perfil.jpg" class="iconoPerfil" alt="Perfil">
                    </div>
                </div>
            </div>

            <div class="infoPerfil">
                <img src="../perfil.jpg" class="avatarGrande">
                <div class="datosUsuario">
                    <h1>Maria Perez</h1>
                    <p>Creadora de contenido de ceramica</p>
                </div>
                <div class="botonesAccion">
                    <button class="botonesGris">Dejar de seguir</button>
                    <button class="botonesGris">Enlaces de contacto</button>
                </div>
            </div>

            <div class="pestanas">
                <button class="ventana activo">Publicaciones</button>
                <button class="ventana">En venta</button>
            </div>

            <div class="mallaPublicaciones">
                <div class="post">
                    <div class="postImagen">
                        <img src="../taza.jpg">
                    </div>
                    <div class="postInfo">
                        <h3>Taza navideña</h3>
                        <p>Ceramica<br>Navidad</p>
                        <div class="iconosPost">
                            <img src="../guardar.png">
                            <img src="../comentario.png">
                        </div>
                    </div>
                </div>
                <div class="post">
                    <div class="postImagen">
                        <img src="../plato.jpg">
                    </div>
                    <div class="postInfo">
                        <h3>Plato floral</h3>
                        <p>Ceramica<br>Primavera</p>
                        <div class="iconosPost">
                            <img src="../guardar.png">
                            <img src="../comentario.png">
                        </div>
                    </div>
                </div>
                <div class="post">
                    <div class="postImagen">
                        <img src="../florero.jpg">
                    </div>
                    <div class="postInfo">
                        <h3>Florero</h3>
                        <p>Ceramica<br>Primavera</p>
                        <div class="iconosPost">
                            <img src="../guardar.png">
                            <img src="../comentario.png">
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
