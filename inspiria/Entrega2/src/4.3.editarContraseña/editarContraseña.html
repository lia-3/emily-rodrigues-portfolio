<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>INSPIRIA - Cambiar Contraseña</title>
    <link rel="stylesheet" href="../estilo.css">
</head>
<body>
    <div class="contenedorPrincipal">
        
        <div class="barraOpciones">
            <ul class="menu">
                <li><img src="../inicio.png" class="iconoMenu"> Inicio</li>
                <li><img src="../mas.png" class="iconoMenu"> Publicar</li>
                <li><img src="../crecer.png" class="iconoMenu"> Tendencias</li>
                <li><img src="../corazon.png" class="iconoMenu"> Siguiendo</li>
                <li><img src="../guardar.png" class="iconoMenu"> Guardados</li>
                <li><img src="../categoria.png" class="iconoMenu"> Categorías</li>
                <li><img src="../tematica.png" class="iconoMenu"> Temáticas</li>
                <li><img src="../muro.png" class="iconoMenu"> Muro</li>
            </ul>
            <div class="contenedorLogo">
                <img src="../logo_inspiria.png" alt="Logo Inspiria" class="imagenLogo">
            </div>
        </div>

        <div class="contenido">
            <div class="contenedorBusqueda">
                <input type="text" placeholder="Buscar" class="inputBuscar">
                <img src="../lupa.png" class="iconoLupa">
                <div class="contenedorPerfil">
                    <div class="circuloPerfil">
                        <img src="../perfil.jpg" class="iconoPerfil" alt="Perfil">
                    </div>
                </div>
            </div>

            <h2 class="tituloSeccion">Configuración | Contraseña</h2>

            <div class="contenedorFormularioContraseña">
                <div class="tarjetaFormulario">
                    <div class="campo">
                        <label>Contraseña actual</label>
                        <input type="password" placeholder="contraseñaActual" value="**************"">
                    </div>

                    <div class="campo">
                        <label>Nueva contraseña</label>
                        <input type="password" placeholder="nuevaContraseña" value="**********">
                    </div>

                    <div class="campo">
                        <label>Repetir nueva contraseña</label>
                        <input type="password" placeholder="usuarioNuevo" value="**********">
                    </div>

                    <div class="botonesFormulario">
                        <button class="boton-cancelar">Cancelar</button>
                        <button class="boton-aceptar">Aceptar</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
