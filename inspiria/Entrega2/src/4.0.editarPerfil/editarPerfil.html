<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INSPIRIA - Configuración de Perfil</title>
    <link rel="stylesheet" href="../estilo.css">
</head>
<body>
    <div class="contenedorPrincipal">
        
        <div class="barraOpciones">
            <ul class="menu">
                <li class="activo">
                <img src="../inicio.png" class="iconoMenu"> Inicio</li>
                <li><img src="../mas.png" class="iconoMenu"> Publicar</li>
                <li><img src="../crecer.png" class="iconoMenu"> Tendencias</li>
                <li><img src="../corazon.png" class="iconoMenu"> Siguiendo</li>
                <li><img src="../guardar.png" class="iconoMenu"> Guardados</li>
                <li><img src="../categoria.png" class="iconoMenu"> Categorías</li>
                <li><img src="../tematica.png" class="iconoMenu"> Temáticas</li>
                <li><img src="../muro.png" class="iconoMenu"> Muro</li>
            </ul>
            <div class="contenedorLogo">
                <img src="../logo_inspiria.png" alt="Logo Inspiria" class="imagenLogo">
            </div>
        </div>

        <div class="contenido">
            <div class="contenedorBusqueda">
                <input type="text" placeholder="Buscar" class="inputBuscar">
                <img src="../lupa.png" class="iconoLupa">           
                <div class="contenedorPerfil">
                    <div class="circuloPerfil">
                        <img src="../perfil.jpg" class="iconoPerfil" alt="Perfil">
                    </div>
                </div>
            </div>

            <h1 class="tituloConfiguracion">Configuración</h1>
            
            <div class="contenedorConfiguracion">
                <div class="tarjetaPerfil">
                    <div class="fotoPerfilPlaceholder">
                    <img src="../perfil.jpg" alt="Foto de perfil" class="imagenPerfilGrande">
                </div>
    
 
                    <div class="infoPerfil">
                        <h3>Nombre de Usuario</h3>
                        <p>Maria Perez</p>
                        
                        <h3>Correo</h3>
                        <p>mariaperez@gmail.com</p>
                        
                        <h3>Descripción</h3>
                        <p>Creadora de contenido de ceramica.</p>
                    </div>
                </div>

                <div class="seccionBotonesConfig">
                    <button class="botonConfig">Cambiar Foto</button>
                    <button class="botonConfig">Cambiar Nombre Usuario</button>
                    <button class="botonConfig">Cambiar Contraseña</button>
                    <button class="botonConfig">Cambiar Descripcion</button>
                    <button class="botonConfig">Gestionar Comisiones</button>
                </div>
            </div>
            
        </div>
    </div>
</body>
</html>
